<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Modal Auth (Daftar / Masuk) -->
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <h2>Daftar / Masuk</h2>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Gmail" required>
        <input type="password" id="auth-password" placeholder="Password" required>
        <button type="submit" class="btn-primary">Lanjutkan dengan Email</button>
      </form>
      <div class="divider">atau</div>
      <button id="google-auth-btn" class="btn-google">Masuk dengan Google</button>
    </div>
  </div>

  <!-- Header & Navbar -->
  <header>
    <div class="logo">MediaDownloader</div>
    <div class="menu-container">
      <button id="hamburger-btn" class="hamburger">&#9776;</button>
      <div id="dropdown-menu" class="dropdown hidden">
        <button id="menu-profile-btn">Profile</button>
        <button id="menu-settings-btn">Setting</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <section class="downloader-card">
      <h1>Pengunduh Video</h1>
      <p>Download video dari TikTok, Instagram, atau YouTube</p>
      
      <div class="input-group">
        <input type="url" id="video-url" placeholder="Tempel link TikTok, Instagram, atau YouTube di sini..." required>
        <button id="fetch-btn" class="btn-primary">Cari Video</button>
      </div>

      <div id="video-result" class="video-result hidden">
        <!-- Hasil pencarian video akan muncul di sini -->
      </div>
    </section>
  </main>

  <!-- Modal Profil -->
  <div id="profile-modal" class="modal hidden">
    <div class="modal-content large">
      <span class="close-btn" id="close-profile">&times;</span>
      <div class="profile-header">
        <h2 id="profile-name-display">Nama Pengguna</h2>
        <button id="edit-profile-btn" class="icon-btn" title="Edit Profile">&#9998;</button>
      </div>
      <p id="profile-status-badge" class="badge">Gratis</p>

      <hr>

      <h3>Riwayat Unduhan</h3>
      <ul id="download-history" class="history-list">
        <!-- Riwayat akan dimuat secara dinamis -->
      </ul>
    </div>
  </div>

  <!-- Modal Edit Profil -->
  <div id="edit-profile-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="close-edit-profile">&times;</span>
      <h2>Edit Profil</h2>
      <form id="edit-profile-form">
        <label>Nama Baru:</label>
        <input type="text" id="edit-name-input" required>
        <label>Sandi Baru:</label>
        <input type="password" id="edit-pass-input" placeholder="Isi jika ingin mengubah">
        <button type="submit" class="btn-primary">Simpan Perubahan</button>
      </form>
    </div>
  </div>

  <!-- Modal Pengaturan -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="close-settings">&times;</span>
      <h2>Pengaturan</h2>
      
      <div class="setting-item">
        <span>Mode Tampilan:</span>
        <button id="toggle-theme-btn" class="btn-secondary">Mode Gelap</button>
      </div>

      <hr>

      <div class="setting-item-column">
        <h3>Aktivasi Akun Premium</h3>
        <input type="text" id="token-input" placeholder="Masukkan Token Premium">
        <button id="redeem-token-btn" class="btn-primary">Klaim Token</button>
      </div>

      <hr>

      <button id="logout-btn" class="btn-danger">Keluar / Ganti Akun</button>
    </div>
  </div>

  <!-- Modal Iklan Video -->
  <div id="ad-modal" class="modal hidden">
    <div class="modal-content ad-box">
      <h3>Iklan (Selesaikan sebelum mengunduh)</h3>
      <video id="ad-video" controls width="100%">
        <source src="https://files.catbox.moe/j37n48.mp4" type="video/mp4">
        Browser Anda tidak mendukung pemutar video.
      </video>
      <button id="skip-ad-btn" class="btn-primary hidden">Lanjutkan Unduhan</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
